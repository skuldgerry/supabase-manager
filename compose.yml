services:
  manager:
    image: skuldgerry/supabase-manager:0.1.2-dev
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MANAGER_DATA_DIR: /data
      MANAGER_PORT: 3000
      MANAGER_BIND_ADDRESS: 0.0.0.0
      MANAGER_PUBLIC_URL: http://localhost:3000
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      SESSION_TTL_HOURS: 24
    ports:
      - "3000:3000"
    volumes:
      - manager-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:' + (process.env.MANAGER_PORT || '3000') + '/api/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  manager-data:
